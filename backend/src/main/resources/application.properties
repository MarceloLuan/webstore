# Local development: optional backend/.env when starting from backend/.
spring.config.import=optional:file:./.env[.properties]

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/webstore}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

jwt.secret=${JWT_SECRET}
jwt.expirationMs=3600000

# Nunca grave o token diretamente neste arquivo. Defina MERCADO_PAGO_ACCESS_TOKEN no ambiente.
mercadopago.access-token=${MERCADO_PAGO_ACCESS_TOKEN:}
mercadopago.webhook-secret=${MERCADO_PAGO_WEBHOOK_SECRET:}
app.webhook-url=${MERCADO_PAGO_WEBHOOK_URL:}
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
estoque.reserva-minutos=${ESTOQUE_RESERVA_MINUTOS:15}
estoque.expiracao-intervalo-ms=${ESTOQUE_EXPIRACAO_INTERVALO_MS:30000}
frete.regioes=${FRETE_REGIOES:80000000-87999999;01000000-19999999}
frete.regras=${FRETE_REGRAS:}
frete.cotacao-minutos=${FRETE_COTACAO_MINUTOS:15}

spring.mail.host=${EMAIL_HOST:}
spring.mail.port=${EMAIL_PORT:587}
spring.mail.username=${EMAIL_USERNAME:}
spring.mail.password=${EMAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${EMAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${EMAIL_SMTP_STARTTLS:true}
email.remetente=${EMAIL_FROM:}
email.confirmacao.expiracao-minutos=${EMAIL_CONFIRMACAO_EXPIRACAO_MINUTOS:60}
email.confirmacao.reenvio-segundos=${EMAIL_CONFIRMACAO_REENVIO_SEGUNDOS:60}
email.recuperacao.expiracao-minutos=${EMAIL_RECUPERACAO_EXPIRACAO_MINUTOS:30}
email.recuperacao.reenvio-segundos=${EMAIL_RECUPERACAO_REENVIO_SEGUNDOS:60}
email.recuperacao.limite-ip=${EMAIL_RECUPERACAO_LIMITE_IP:5}
email.recuperacao.janela-minutos=${EMAIL_RECUPERACAO_JANELA_MINUTOS:15}
