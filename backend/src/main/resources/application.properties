# Local development: optional backend/.env when starting from backend/.
spring.config.import=optional:file:./.env[.properties]

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/webstore}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

jwt.secret=${JWT_SECRET}
jwt.expirationMs=3600000

# Nunca grave o token diretamente neste arquivo. Defina MERCADO_PAGO_ACCESS_TOKEN no ambiente.
mercadopago.access-token=${MERCADO_PAGO_ACCESS_TOKEN:}
mercadopago.webhook-secret=${MERCADO_PAGO_WEBHOOK_SECRET:}
app.webhook-url=${MERCADO_PAGO_WEBHOOK_URL:}
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
estoque.reserva-minutos=${ESTOQUE_RESERVA_MINUTOS:15}
estoque.expiracao-intervalo-ms=${ESTOQUE_EXPIRACAO_INTERVALO_MS:30000}
